<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$MD_TITLE</title>

  <!-- Core styles -->
  <link href="https://unpkg.com/@primer/css@^16.0.0/dist/primer.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/primer/github-syntax-light@master/lib/github-light.css" id="light-hl" />
  <link rel="stylesheet alternate" href="https://cdn.jsdelivr.net/gh/primer/github-syntax-dark@master/lib/github-dark.css" id="dark-hl" />

  <style>
    body {
      margin: 0;
    }

    .header-bar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: var(--color-canvas-default);
      border-bottom: 1px solid var(--color-border-default);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: flex-end;
    }

    .content-container {
      padding: 3rem 1.5rem 4rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .Box-body {
      padding: 2rem !important;
    }

    .markdown-body {
      margin: 0 !important;
      padding: 0 !important;
    }

    @media (min-width: 768px) {
      .content-container { padding: 4rem 2rem 5rem; }
      .Box-body { padding: 3rem !important; }
    }

    @media (min-width: 1024px) {
      .content-container { padding: 5rem 3rem 6rem; }
    }
  </style>
</head>

<body id="markdown-body" data-color-mode="light" data-dark-theme="light">
  <div class="header-bar">
    <button id="theme-button" class="btn btn-sm" type="button" aria-label="Toggle theme">
      <span id="theme-icon" class="iconify" data-icon="octicon:sun-16"></span>
    </button>
  </div>

  <main class="content-container container-xl">
    <div class="Box Box--responsive">
      <div class="Box-body">
        <article class="markdown-body entry-content container-lg" itemprop="text">
          $MD_HTML
        </article>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/gh/calganaygun/MDcat@main/theme.js"></script>
  <script src="https://code.iconify.design/2/2.0.3/iconify.min.js"></script>
</body>
</html>
